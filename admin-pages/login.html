<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход в CMS — ShumDev</title>
    <link rel="stylesheet" href="/site/css/admin.css" />
  </head>

 <body class="admin-login-page">
  <main class="admin-login">
    <section class="admin-login__visual" aria-label="АвтоZавоз">
      <a
        href="/"
        class="admin-login__brand"
        aria-label="Вернуться на сайт АвтоZавоз"
      >
        <img src="/site/img/Logo.png" alt="АвтоZавоз" />
      </a>

      <div class="admin-login__visual-content">
        <span>АВТОZАВОЗ19</span>

        <p>
          Автомобили из Японии, Кореи,<br />
          Китая и ОАЭ
        </p>
      </div>
    </section>

    <section class="admin-login__content">
      <div class="admin-login__inner">
        <p class="admin-login__badge">SHUMDEV CUSTOM CMS</p>

        <h1>Вход в панель</h1>

        <p class="admin-login__text">
          Управление каталогом автомобилей и заявками АвтоZавоз19.
        </p>

        <form class="admin-login__form" id="adminLoginForm">
          <label>
            <span>Email</span>

            <input
              type="email"
              name="email"
              placeholder="Введите email"
              autocomplete="username"
              required
            />
          </label>

          <label>
            <span>Пароль</span>

            <div class="admin-login__password">
              <input
                type="password"
                name="password"
                id="adminLoginPassword"
                placeholder="Введите пароль"
                autocomplete="current-password"
                required
              />

              <button
                type="button"
                class="admin-login__password-toggle"
                id="adminPasswordToggle"
                aria-label="Показать пароль"
              >
                Показать
              </button>
            </div>
          </label>

          <button
            type="submit"
            class="admin-login__submit"
            id="adminLoginButton"
          >
            Войти
          </button>

          <p class="admin-login__message" id="adminLoginMessage"></p>
        </form>

        <div class="admin-login__access">
          <span aria-hidden="true"></span>
          Доступ разрешён только администратору АвтоZавоз19.
        </div>

        <a href="/" class="admin-login__back">
          Вернуться на сайт
        </a>
      </div>
    </section>
  </main>

  <script src="/admin/js/login.js"></script>
</body>
</html>
